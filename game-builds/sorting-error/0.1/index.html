<!doctype html>
<html lang="en"><head><meta name="robots" content="noindex, follow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SORTING ERROR // KATOVIA</title>
<style>
:root{--bg:#11160f;--panel:#20291e;--edge:#687c53;--amber:#e5bd6b;--green:#a7ca8d;--red:#df7765}
*{box-sizing:border-box}body{margin:0;background:#0b0e0a;color:var(--green);font-family:Consolas,"Courier New",monospace;display:flex;justify-content:center;min-height:100vh}
#shell{width:min(1050px,100%);padding:18px}header,.status,.actions,.footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{color:var(--amber);font-size:clamp(20px,4vw,33px);letter-spacing:3px;margin:5px 0}small,.muted{color:#86977a}.panel{border:2px solid var(--edge);background:var(--panel);padding:13px;margin:12px 0;box-shadow:inset 0 0 0 2px #141a13}
#screen{display:block;width:100%;aspect-ratio:16/9;background:#19251c;image-rendering:pixelated;border:3px solid #52664b}
button{background:#2b3b2c;border:2px solid #82956a;color:#e9d7a4;padding:11px 14px;font:700 14px Consolas,monospace;cursor:pointer;min-height:44px}
button:hover,button:focus-visible{background:#4d5e40;outline:2px solid var(--amber)}button:disabled{opacity:.45;cursor:not-allowed}
.actions button{flex:1;min-width:105px}#rules{color:var(--amber);line-height:1.65}#notice{min-height:28px;color:#e4c78e}
#overlay{position:fixed;inset:0;background:#080d09;display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
#overlay.hidden{display:none}#modal{width:min(650px,100%);padding:30px;border:2px solid #83966e;background:#172018;text-align:center;box-shadow:0 0 70px #283e27}
#modal h2{color:var(--amber);letter-spacing:4px}#modal p{line-height:1.65}#modal button{margin:8px}
#introLogo{font-size:clamp(32px,9vw,72px);font-weight:900;letter-spacing:8px;color:#a5e2b0;text-shadow:3px 0 #375b3b,-3px 0 #59876c;animation:glitch .17s infinite alternate}
@keyframes glitch{from{transform:translateX(-1px);opacity:.82}to{transform:translateX(1px);opacity:1}}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,#0002 4px 5px);z-index:20}
kbd{border:1px solid #86977a;padding:1px 4px;color:#e3cb8a}
@media(max-width:600px){#shell{padding:9px}.panel{padding:9px}button{font-size:12px;padding:9px 6px}}
@media(prefers-reduced-motion:reduce){#introLogo{animation:none}}
</style></head><body>
<div id="shell">
<header><div><small>KATOVIA // INDUSTRIAL SYSTEMS</small><h1>SORTING ERROR</h1></div><div><div id="levelText">SHIFT 01 / 03</div><small id="clockText">SYS: STANDBY</small></div></header>
<div class="panel status"><span id="scoreText">SCORE 00000</span><span id="accuracyText">ACCURACY 100%</span><span id="errorText">ERRORS 0 / 5</span><span id="progressText">PARCELS 0 / 8</span></div>
<div class="panel"><strong>ACTIVE SORTING RULES</strong><div id="rules"></div></div>
<canvas id="screen" width="640" height="360" aria-label="Animated retro conveyor belt with incoming parcels and four sorting lanes"></canvas>
<div class="panel"><div id="parcelText">AWAITING PARCEL</div><div id="notice" role="status" aria-live="polite">SYSTEM READY.</div></div>
<div class="actions"><button data-lane="A">[1] LINE A</button><button data-lane="B">[2] LINE B</button><button data-lane="C">[3] LINE C</button><button data-lane="HOLD">[4] HOLD</button></div>
<div class="footer panel"><span><kbd>SPACE</kbd> INSPECT · <kbd>P</kbd> PAUSE</span><div><button id="sound">SOUND: OFF</button><button id="pause">PAUSE</button><button id="help">HELP</button></div></div>
<small>PROTOTYPE v0.1 · 3 SHIFTS · ALL GRAPHICS GENERATED IN CANVAS · OFFLINE</small>
</div>
<div id="overlay"><div id="modal"></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('screen'),ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
const levels=[
 {name:'TRAINING SHIFT',target:8,speed:63,interval:3.3,errors:5,rules:['RED → LINE A','BLUE → LINE B','YELLOW → LINE C','UNMARKED → HOLD'],mode:0},
 {name:'WEIGHT CHECK',target:10,speed:82,interval:2.8,errors:5,rules:['HEAVY (≥ 7 KG) → LINE C','OTHER RED → LINE A','OTHER BLUE → LINE B','OTHER YELLOW / UNMARKED → HOLD'],mode:1},
 {name:'SYSTEM CONFLICT',target:12,speed:98,interval:2.5,errors:5,rules:['DAMAGED LABEL → HOLD (HIGHEST PRIORITY)','HEAVY (≥ 7 KG) → LINE C','OTHER RED → LINE A','OTHER BLUE → LINE B','OTHER YELLOW / UNMARKED → HOLD'],mode:2}
];
let phase='intro',level=0,score=0,errors=0,handled=0,correct=0,elapsed=0,spawnTimer=0,active=null,queue=[],effects=[],last=0,paused=false,muted=true,audio=null,inspect=false,levelDone=false;
let introTimer=null;
const colors={RED:'#a9574e',BLUE:'#5a81aa',YELLOW:'#c4a052',UNMARKED:'#7d7968'};
function beep(freq=420,dur=.07){if(muted)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=freq;g.gain.value=.025;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
function overlay(title,body,buttons){$('overlay').classList.remove('hidden');$('modal').innerHTML=`<h2>${title}</h2><p>${body}</p>`;for(const [label,fn] of buttons){const b=document.createElement('button');b.textContent=label;b.onclick=fn;$('modal').append(b)}}
function hideOverlay(){$('overlay').classList.add('hidden')}
function intro(){phase='intro';overlay('','<div id="introLogo">KATOVIA</div><p>/// SIGNAL FOUND ///</p><small>BOOT SEQUENCE</small>',[['SKIP',finishIntro]]);introTimer=setTimeout(finishIntro,4200)}
function finishIntro(){if(phase!=='intro')return;clearTimeout(introTimer);phase='menu';overlay('SORTING ERROR','1998 · CENTRAL DISTRIBUTION FACILITY<br>Sort the incoming parcels before they reach the end of the belt.<br><br>Some parcels are not in the manifest.',[['START SHIFT',()=>start(0)],['HOW TO PLAY',help]])}
function help(){const prev=phase;overlay('OPERATOR MANUAL','Choose the correct lane using 1–4 or the buttons. The parcel moves along the belt; if it reaches the end, it counts as a missed parcel.<br><br>Read the current rules carefully. Later shifts introduce weight priority and damaged labels.<br><br>SPACE toggles inspection details. P pauses. Five errors fail a shift.',[['BACK',()=>{if(prev==='menu'){phase='menu';finishMenu()}else{hideOverlay();if(phase==='playing')paused=false}}]])}
function finishMenu(){overlay('SORTING ERROR','1998 · CENTRAL DISTRIBUTION FACILITY<br>Ready for your shift?', [['START SHIFT',()=>start(0)],['HOW TO PLAY',help]])}
function seededPackage(){const col=['RED','BLUE','YELLOW','UNMARKED'][Math.floor(Math.random()*4)],kg=1+Math.floor(Math.random()*10),damaged=level===2&&Math.random()<.22;return{id:'PKG-'+String(1000+Math.floor(Math.random()*9000)),col,kg,damaged,x:-65,y:163,done:false}}
function correctLane(p){if(level===2&&p.damaged)return'HOLD';if(level>=1&&p.kg>=7)return'C';if(p.col==='RED')return'A';if(p.col==='BLUE')return'B';if(level===0&&p.col==='YELLOW')return'C';return'HOLD'}
function start(n){level=n;phase='playing';score=n===0?0:score;errors=0;handled=0;correct=0;elapsed=0;spawnTimer=.7;active=null;queue=[];effects=[];paused=false;levelDone=false;inspect=false;hideOverlay();$('rules').innerHTML=levels[n].rules.map(s=>'<div>▸ '+s+'</div>').join('');$('notice').textContent='SHIFT STARTED. MONITOR THE BELT.';updateHUD();beep(560)}
function updateHUD(){$('levelText').textContent='SHIFT '+String(level+1).padStart(2,'0')+' / 03';$('clockText').textContent='SYS: '+(phase==='playing'?'ONLINE':'STANDBY')+' · '+Math.floor(elapsed/60).toString().padStart(2,'0')+':'+Math.floor(elapsed%60).toString().padStart(2,'0');$('scoreText').textContent='SCORE '+String(score).padStart(5,'0');$('accuracyText').textContent='ACCURACY '+(handled?Math.round(correct/handled*100):100)+'%';$('errorText').textContent='ERRORS '+errors+' / '+levels[level].errors;$('progressText').textContent='PARCELS '+handled+' / '+levels[level].target;$('parcelText').textContent=active?`${active.id}  ·  ${active.col}  ·  ${active.kg} KG  ·  LABEL: ${active.damaged?'DAMAGED':'OK'}`:'AWAITING PARCEL'}
function report(lane){if(phase!=='playing'||paused||!active||levelDone)return;const p=active;active=null;handled++;const good=correctLane(p)===lane;if(good){score+=100+Math.floor((560-p.x)/10);correct++;$('notice').textContent='ACCEPTED // ROUTED TO '+lane;beep(670,.09)}else{errors++;$('notice').textContent='SORTING ERROR // EXPECTED '+correctLane(p)+' · SENT '+lane;beep(150,.18)}effects.push({x:p.x,y:p.y,t:0,lane,good,col:p.col});updateHUD();checkEnd()}
function checkEnd(){if(levelDone)return;if(errors>=levels[level].errors){levelDone=true;phase='result';overlay('SHIFT FAILED','Too many sorting errors. The facility has flagged your operator ID.',[['RETRY SHIFT',()=>start(level)],['MAIN MENU',()=>{phase='menu';finishMenu()}]]);return}if(handled>=levels[level].target){levelDone=true;phase='result';const final=level===2;try{localStorage.setItem('katovia_sorting_error_best',String(Math.max(score,Number(localStorage.getItem('katovia_sorting_error_best'))||0)))}catch(e){}overlay(final?'SORTING COMPLETE':'SHIFT COMPLETE',`ACCURACY: ${Math.round(correct/handled*100)}%<br>SCORE: ${score}<br>${final?'UNREGISTERED PARCEL DETECTED.<br>RECIPIENT: OPERATOR.':''}`,final?[['PLAY AGAIN',()=>start(0)],['MAIN MENU',()=>{phase='menu';finishMenu()}]]:[['NEXT SHIFT',()=>start(level+1)],['MAIN MENU',()=>{phase='menu';finishMenu()}]])}}
function step(dt){if(phase!=='playing'||paused)return;elapsed+=dt;spawnTimer-=dt;if(!active&&handled<levels[level].target&&spawnTimer<=0){active=seededPackage();spawnTimer=levels[level].interval;beep(280,.025)}if(active){active.x+=levels[level].speed*dt;if(active.x>550){const p=active;active=null;handled++;errors++;$('notice').textContent='MISSED PARCEL // '+p.id;effects.push({x:555,y:170,t:0,lane:'MISS',good:false,col:p.col});beep(120,.15);updateHUD();checkEnd()}}effects.forEach(e=>e.t+=dt);effects=effects.filter(e=>e.t<.9);updateHUD()}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function text(s,x,y,color='#a7ca8d',size=13){ctx.fillStyle=color;ctx.font=`bold ${size}px monospace`;ctx.fillText(s,x,y)}
function draw(){const w=640,h=360;rect(0,0,w,h,'#1a251b');for(let i=0;i<22;i++){rect(i*32,0,1,360,'#263529')}rect(0,20,640,18,'#293a2c');text('CENTRAL DISTRIBUTION FACILITY / SORTING BAY 04',13,34,'#9dbd8c',12);text('LIVE FEED',525,34,'#d1b36f',11);
for(let i=0;i<4;i++){const x=44+i*146;rect(x,255,116,75,'#2b392c');rect(x+3,257,110,7,['#a9574e','#5a81aa','#c4a052','#84917d'][i]);text(['A','B','C','HOLD'][i],x+35,295,'#e2c88a',20);text('SORT LINE',x+13,313,'#9bb18b',10)}
rect(0,144,640,80,'#414b3c');rect(0,153,640,62,'#29332b');for(let i=0;i<21;i++){const x=(i*37+Math.floor(elapsed*36)%37)%680-20;rect(x,157,26,53,'#4b5747');rect(x+3,160,20,2,'#71806a')}rect(0,144,640,6,'#7d8969');rect(0,217,640,7,'#75846a');
rect(548,100,12,130,'#6b755e');rect(535,103,38,13,'#303e32');rect(545,110,18,7,active?'#c1a057':'#527957');text('SCAN',527,96,'#a8bf9c',12);
if(active){const p=active,x=Math.round(p.x),y=165;rect(x+3,y+4,63,46,'#121c15');rect(x,y,62,44,colors[p.col]);rect(x,y,62,4,'#e3c78d');rect(x+28,y,5,44,'#b9a47c');rect(x+7,y+12,49,19,'#d5c8a4');text(p.id.slice(-4),x+11,y+26,'#253026',12);if(p.damaged){rect(x+45,y+7,13,5,'#df7765');text('!',x+47,y+17,'#d94135',12)}}
for(const e of effects){text(e.good?'✓ '+e.lane:'X '+e.lane,Math.min(e.x,550),e.y-20-e.t*40,e.good?'#a7e19a':'#e58471',18)}
rect(9,340,622,2,'#5b7052');text('SHIFT '+String(level+1).padStart(2,'0')+' // '+levels[level].name,10,353,'#b8c897',10);
if(inspect&&active){rect(155,60,330,78,'#101a14');ctx.strokeStyle='#d2ba7e';ctx.strokeRect(155,60,330,78);text('PACKAGE INSPECTION',169,81,'#e2c88a',14);text(active.id+'  '+active.col+'  '+active.kg+' KG',169,103,'#c2d6b1',13);text('LABEL: '+(active.damaged?'DAMAGED':'INTACT'),169,123,active.damaged?'#e18a76':'#b3caa3',12)}
if(paused){rect(0,0,640,360,'#000b');text('PAUSED',275,183,'#e2c88a',25)}
}
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;step(dt);draw();requestAnimationFrame(loop)}
function togglePause(){if(phase!=='playing')return;paused=!paused;$('pause').textContent=paused?'RESUME':'PAUSE';$('notice').textContent=paused?'SHIFT PAUSED':'SHIFT RESUMED'}
document.querySelectorAll('[data-lane]').forEach(b=>b.addEventListener('click',()=>report(b.dataset.lane)));
$('pause').onclick=togglePause;$('help').onclick=()=>{if(phase==='playing'){paused=true;help()}else help()};
$('sound').onclick=()=>{muted=!muted;$('sound').textContent='SOUND: '+(muted?'OFF':'ON');beep(550)};
window.addEventListener('keydown',e=>{if(phase==='intro'&&(e.key==='Escape'||e.key==='Enter')){finishIntro();return}if(phase!=='playing')return;if(['1','2','3','4',' ','p','P'].includes(e.key))e.preventDefault();if(e.key==='p'||e.key==='P')togglePause();if(e.key===' '){inspect=!inspect;return}if(e.key>='1'&&e.key<='4')report(['A','B','C','HOLD'][Number(e.key)-1])});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&phase==='playing'){paused=true;$('pause').textContent='RESUME'}});
requestAnimationFrame(loop);intro();
})();
</script></body></html>
